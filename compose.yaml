services:
  db:
    image: postgres:18
    container_name: runamarga-new-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - new_crm_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: runamarga-new-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - new_crm_uploads:/app/backend/app/static/uploads

  frontend:
    build:
      context: ./admin-react
      dockerfile: Dockerfile
    container_name: runamarga-new-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:80"
    depends_on:
      - backend

volumes:
  new_crm_postgres_data:
  new_crm_uploads:
